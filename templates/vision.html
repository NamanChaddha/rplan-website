<!DOCTYPE html>
<html lang="en">
{% extends "base.html" %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision | rPlan</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #061311;
            color: #ffffff;
        }

        .vision {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 15% 25%,
                    rgba(0, 150, 136, 0.20),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 75%,
                    rgba(0, 200, 170, 0.12),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #061311 0%,
                    #081c19 50%,
                    #04100e 100%
                );
        }

        /* Background glow */
        .glow {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: rgba(0, 190, 170, 0.08);
            filter: blur(80px);
        }

        .glow.one {
            top: -200px;
            left: -150px;
        }

        .glow.two {
            bottom: -200px;
            right: -150px;
        }

        /* Main content */
        .vision-container {
            width: 90%;
            max-width: 1100px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        /* Label */
        .tag {
            display: inline-block;
            padding: 9px 24px;

            border: 1px solid rgba(0, 200, 170, 0.35);
            border-radius: 50px;

            background: rgba(0, 150, 136, 0.08);

            color: #4de1c5;

            font-size: 13px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;

            margin-bottom: 25px;

            box-shadow:
                0 0 25px rgba(0, 190, 170, 0.08);
        }

        /* Heading */
        h1 {
            font-size: clamp(3.5rem, 8vw, 7rem);
            font-weight: 700;
            line-height: 1;

            margin-bottom: 40px;

            background: linear-gradient(
                90deg,
                #00a896,
                #35d6bd,
                #7af2d9
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            filter: drop-shadow(
                0 0 25px rgba(0, 200, 170, 0.15)
            );
        }

        /* Vision card */
        .vision-card {
            max-width: 950px;
            margin: auto;

            padding: 60px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.07),
                    rgba(255,255,255,0.025)
                );

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(80, 220, 195, 0.15);

            border-radius: 28px;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255,255,255,0.05);

            transition:
                transform 0.4s ease,
                box-shadow 0.4s ease;
        }

        .vision-card:hover {
            transform: translateY(-6px);

            box-shadow:
                0 40px 100px rgba(0, 0, 0, 0.55),
                0 0 40px rgba(0, 180, 160, 0.08);
        }

        /* Vision text */
        .vision-card p {
            font-size: clamp(1.3rem, 2.5vw, 1.8rem);
            line-height: 1.7;
            color: #c5d8d4;
            font-weight: 400;
        }

        .vision-card strong {
            color: #48dfc3;
            font-weight: 600;
        }

        /* Bottom accent */
        .accent {
            width: 90px;
            height: 4px;

            margin: 40px auto 0;

            border-radius: 10px;

            background: linear-gradient(
                90deg,
                #00796b,
                #00bfa5,
                #65e8d0
            );

            box-shadow:
                0 0 20px rgba(0, 200, 170, 0.4);
        }

        /* Mobile */
        @media (max-width: 600px) {
            .vision-card {
                padding: 35px 25px;
                border-radius: 20px;
            }

            .vision-card p {
                font-size: 1.2rem;
            }

            .tag {
                font-size: 11px;
                letter-spacing: 2px;
            }

            h1 {
                margin-bottom: 30px;
            }
        }
    </style>
</head>

<body>

<section class="vision">

    <div class="glow one"></div>
    <div class="glow two"></div>

    <div class="vision-container">

        <div class="tag">
            Our Vision
        </div>

        <h1>Vision</h1>

        <div class="vision-card">

            <p>
                <strong>rPlan</strong> aspires to be recognised as a
                <strong>Project Controls Adviser</strong> trusted for its
                <strong>excellence model</strong> in all codes of practices.
            </p>

            <div class="accent"></div>

        </div>

    </div>

</section>

</body>
</html>
