{% extends "base.html" %}

{% block title %}Vision | rPlan{% endblock %}

{% block content %}
<section class="relative min-h-[85vh] flex flex-col items-center justify-center overflow-hidden py-20 px-4">
    
    <!-- Background Ambient Glows -->
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-teal-500/10 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-emerald-500/10 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="relative z-10 w-full max-w-5xl mx-auto flex flex-col items-center text-center">
        
        <!-- Animated Pill Tag -->
        <div class="inline-flex items-center gap-3 px-6 py-2 rounded-full border border-teal-500/30 bg-teal-500/10 mb-8 shadow-[0_0_20px_rgba(20,184,166,0.1)]">
            <span class="relative flex h-2.5 w-2.5">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-teal-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-teal-500"></span>
            </span>
            <span class="text-teal-400 text-sm font-bold tracking-[0.2em] uppercase">Our Vision</span>
        </div>

        <!-- Massive Gradient Heading -->
        <h1 class="text-5xl md:text-7xl font-extrabold mb-14 tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-teal-300 via-emerald-200 to-teal-400 drop-shadow-lg">
            Shaping the Future
        </h1>

        <!-- Glassmorphism Vision Card -->
        <div class="group relative w-full max-w-4xl p-10 md:p-14 rounded-3xl bg-gray-800/40 border border-gray-600/30 backdrop-blur-xl shadow-2xl transition-all duration-500 hover:bg-gray-800/60 hover:-translate-y-2 hover:shadow-[0_20px_40px_-15px_rgba(20,184,166,0.15)] hover:border-teal-500/30">
            
            <!-- Decorative Quote Mark -->
            <div class="absolute -top-8 -left-2 text-8xl text-teal-500/10 font-serif select-none pointer-events-none">"</div>
            
            <p class="text-2xl md:text-3xl lg:text-4xl leading-relaxed text-gray-300 font-light relative z-10">
                <strong class="font-semibold text-white">rPlan</strong> aspires to be recognised as a 
                <strong class="font-semibold text-teal-400">Project Controls Adviser</strong> trusted for its 
                <strong class="font-semibold text-emerald-400">excellence model</strong> in all codes of practices.
            </p>
            
            <!-- Expanding Bottom Accent -->
            <div class="w-16 h-1.5 rounded-full bg-gradient-to-r from-teal-500 to-emerald-400 mx-auto mt-12 shadow-[0_0_15px_rgba(20,184,166,0.4)] group-hover:w-32 transition-all duration-500 ease-out"></div>
            
        </div>
    </div>
</section>
{% endblock %}
