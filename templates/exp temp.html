<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Experience | rPlan Consulting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-accent: #fbbf24; /* Amber 400 */
            --secondary-accent: #f97316; /* Orange 500 */
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030712;
            overflow-x: hidden;
            color: #f9fafb;
        }

        /* Animated Mesh Background */
        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 0% 0%, rgba(251, 191, 36, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(249, 115, 22, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(17, 24, 39, 1) 0%, rgba(3, 7, 18, 1) 100%);
        }

        .mesh-bg::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
        }

        /* Hero Text Gradient */
        .text-gradient {
            background: linear-gradient(135deg, #fff 0%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .accent-gradient {
            background: linear-gradient(to right, var(--primary-accent), var(--secondary-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Carousel Container */
        .carousel-stage {
            perspective: 2000px;
            height: 450px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .slide {
            position: absolute;
            width: 550px;
            height: 350px;
            border-radius: 24px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: #111827; /* Fallback while loading */
        }

        @media (max-width: 768px) {
            .slide {
                width: 85vw;
                height: 50vw;
            }
            .carousel-stage {
                height: 350px;
            }
        }

        .slide-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.4), transparent);
            border-radius: 24px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .slide.active .slide-overlay {
            opacity: 1;
        }

        .slide:not(.active) {
            filter: brightness(0.4) blur(1px);
        }

        /* Custom Navigation Buttons */
        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary-accent);
            transform: scale(1.1);
        }

        /* Dot Indicators */
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.4s;
            cursor: pointer;
        }
        .dot.active {
            width: 24px;
            background: var(--primary-accent);
        }

        /* Caption Styling */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="mesh-bg"></div>

    <!-- Main Content Wrapper -->
    <main class="relative z-10 min-h-screen flex flex-col items-center py-12 px-6">
        
        <!-- Header -->
        <header class="text-center max-w-4xl mb-16 space-y-4">
            <div class="inline-block px-4 py-1.5 rounded-full border border-amber-500/30 bg-amber-500/5 text-amber-400 text-xs font-bold tracking-widest uppercase mb-4">
                Global Impact & Expertise
            </div>
            <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight">
                <span class="text-gradient">Previous </span>
                <span class="accent-gradient">Training pics</span>
            </h1>
            <p class="text-gray-400 text-lg md:text-xl font-light leading-relaxed max-w-2xl mx-auto">
                rPlan delivers high-impact Primavera P6 training and project management solutions across the globe.
            </p>
        </header>

        <!-- Carousel Section -->
        <div class="w-full max-w-6xl relative group">
            
            <!-- Navigation Arrows -->
            <button id="prevBtn" class="nav-btn absolute left-0 top-1/2 -translate-y-1/2 -translate-x-6 z-50 p-4 rounded-full opacity-0 group-hover:opacity-100 hidden md:flex" aria-label="Previous Slide">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
            </button>
            
            <button id="nextBtn" class="nav-btn absolute right-0 top-1/2 -translate-y-1/2 translate-x-6 z-50 p-4 rounded-full opacity-0 group-hover:opacity-100 hidden md:flex" aria-label="Next Slide">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
            </button>

            <!-- 3D Stage -->
            <div id="carousel-stage" class="carousel-stage"></div>

            <!-- Indicators -->
            <div id="dot-container" class="flex justify-center gap-3 mt-8"></div>
        </div>

        <!-- Caption Area -->
        <div class="w-full max-w-3xl mt-12 mb-16">
            <div class="glass-card p-8 min-h-[140px] flex items-center justify-center text-center">
                <p id="caption-text" class="text-gray-200 text-lg md:text-xl font-medium leading-relaxed transition-all duration-500 opacity-100"></p>
            </div>
        </div>

        <!-- Footer -->
        <footer class="mt-auto text-gray-500 text-sm">
            &copy; <span id="year"></span> rPlan Consulting. All rights reserved.
        </footer>

    </main>

    <script>
        const images = [
            {
                src: 'static/training_1.jpeg',
                caption: 'Conducted specialized P6 Online training for a distributed team of Planning Engineers across Australia.'
            },
            {
                src: 'static/training_2.jpeg',
                caption: 'Completed professional EPPM certification training for industry experts utilizing version 24.12.'
            },
            {
                src: 'static/training_3.jpeg',
                caption: 'P6 Professional training for leading corporate clients on advanced Oracle Cloud environments.'
            },
            {
                src: 'static/training_4.jpeg',
                caption: 'Empowering engineering teams through intensive Primavera version 25 training programs.'
            },
            {
                src: 'static/training_5.jpeg',
                caption: 'Seamless EPPM professional development sessions tailored for high-stakes infrastructure projects.'
            },
            {
                src: 'static/training_6.jpeg',
                caption: 'Bridging technical gaps with world-class P6 instruction and project management consulting.'
            },
            {
                src: 'static/training_7.jpeg',
                caption: 'Hands-on resource leveling and critical path method workshops for senior schedulers.'
            },
            {
                src: 'static/training_8.jpeg',
                caption: 'Enterprise project portfolio governance training delivered for mega-project leads.'
            },
            {
                src: 'static/training_9.jpeg',
                caption: 'Interactive real-time schedule risk analysis and baseline management sessions.'
            },
            {
                src: 'static/training_10.jpeg',
                caption: 'Collaborative workshop highlighting multi-project resource optimization in P6 EPPM.'
            }
        ];

        let currentIndex = 0;
        const stage = document.getElementById('carousel-stage');
        const caption = document.getElementById('caption-text');
        const dotsContainer = document.getElementById('dot-container');
        let autoRotate;

        function initGallery() {
            if (!stage || !caption || !dotsContainer) return;

            images.forEach((img, i) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                slide.style.backgroundImage = `url('${img.src}')`;
                slide.innerHTML = `<div class="slide-overlay"></div>`;
                slide.onclick = () => goToSlide(i);
                stage.appendChild(slide);

                const dot = document.createElement('div');
                dot.className = `dot ${i === 0 ? 'active' : ''}`;
                dot.onclick = () => goToSlide(i);
                dotsContainer.appendChild(dot);
            });
            updateGallery();
            startAutoRotate();
        }

        function updateGallery() {
            const slides = document.querySelectorAll('.slide');
            const dots = document.querySelectorAll('.dot');
            const total = images.length;

            slides.forEach((slide, i) => {
                let offset = i - currentIndex;
                
                // Circular wrapping
                if (offset < -total / 2) offset += total;
                if (offset > total / 2) offset -= total;

                const absOffset = Math.abs(offset);
                slide.classList.toggle('active', offset === 0);
                
                // 3D positioning logic
                let translateX = offset * 250;
                let translateZ = absOffset * -300;
                let rotateY = offset * -35;
                let opacity = 1 - (absOffset * 0.35);
                let zIndex = 100 - absOffset;

                if (window.innerWidth < 768) {
                    translateX = offset * 110;
                    translateZ = absOffset * -180;
                }

                slide.style.transform = `translateX(${translateX}px) translateZ(${translateZ}px) rotateY(${rotateY}deg)`;
                slide.style.opacity = absOffset > 3 ? 0 : Math.max(opacity, 0);
                slide.style.zIndex = zIndex;
            });

            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === currentIndex);
            });

            caption.style.opacity = 0;
            caption.style.transform = "translateY(10px)";
            
            setTimeout(() => {
                caption.textContent = images[currentIndex].caption;
                caption.style.opacity = 1;
                caption.style.transform = "translateY(0)";
            }, 300);
        }

        function goToSlide(index) {
            currentIndex = index;
            updateGallery();
            resetAutoRotate();
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % images.length;
            updateGallery();
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            updateGallery();
        }

        function startAutoRotate() {
            autoRotate = setInterval(nextSlide, 7000);
        }

        function resetAutoRotate() {
            clearInterval(autoRotate);
            startAutoRotate();
        }

        // Attach event listeners safely
        const nextBtn = document.getElementById('nextBtn');
        const prevBtn = document.getElementById('prevBtn');
        if (nextBtn) nextBtn.onclick = () => { nextSlide(); resetAutoRotate(); };
        if (prevBtn) prevBtn.onclick = () => { prevSlide(); resetAutoRotate(); };

        const yearEl = document.getElementById('year');
        if (yearEl) yearEl.textContent = new Date().getFullYear();

        window.onresize = updateGallery;

        initGallery();
    </script>
</body>
</html>
