    <style>
        body { background-color: #071F21; color: #c9d1d9; font-family: 'Inter', sans-serif; }
        
        .huge-card {
            background: rgba(10, 45, 48, 0.5);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(20, 184, 166, 0.1);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden; /* Ensures image stays in frame */
        }
        
        .huge-card:hover {
            border-color: rgba(20, 184, 166, 0.6);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5), 0 0 32px rgba(20, 184, 166, 0.2);
            transform: translateY(-8px) scale(1.02);
        }
    </style>
